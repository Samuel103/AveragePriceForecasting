[project]
name = "averageforecating"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Samuel103", email = "samuel.gascon@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "openai-agents>=0.4.0,<1",
    "openai>=1.0.0,<3",
    "polars>=2.0.0",
    "pydantic-settings>=2.0.0,<3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
agent = "agent.main:main"
forecast = "forecasting.main:main"

[dependency-groups]
notebooks = ["ipykernel>=6"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["agent", "forecasting"]
